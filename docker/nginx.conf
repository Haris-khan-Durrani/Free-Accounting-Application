server {
    listen 80 default_server;
    listen [::]:80 default_server;
    
    server_name _;
    root /var/www/html;
    index index.php index.html;

    client_max_body_size 50M;

    # Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;

    # Clean URL handling (extensionless PHP routes)
    location / {
        try_files $uri $uri/ $uri.php?$args;
    }

    # Pass PHP scripts to PHP-FPM socket/port
    location ~ \.php$ {
        try_files $uri =404;
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        fastcgi_pass 127.0.0.1:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;
        fastcgi_read_timeout 300;
    }

    # Static assets caching
    location ~* \.(jpg|jpeg|png|gif|ico|css|js|woff|woff2|ttf|svg|eot)$ {
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }

    # Block direct HTTP access to sensitive files, dumps, logs, storage, and configs
    location ~* ^/(config\.php|database\.sql|\.env|Dockerfile|docker-compose\.yml|composer\.(json|lock)|storage/.*|\.log)$ {
        deny all;
        return 404;
    }

    # Block access to hidden files (.git, .env, etc.)
    location ~ /\. {
        deny all;
        return 404;
    }
}
