version: '3.8'

services:
  # ----------------------------------------------------------------------------
  # Web Application Container (PHP 8.3-FPM + Nginx)
  # ----------------------------------------------------------------------------
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: onesol_app_web
    restart: always
    ports:
      - "${APP_PORT:-8080}:80"
    environment:
      DB_HOST: db
      DB_PORT: 3306
      DB_NAME: ${DB_NAME:-onesol_invoices}
      DB_USER: ${DB_USER:-onesol}
      DB_PASS: ${DB_PASS:-onesol_secret}
      REDIS_HOST: cache
      REDIS_PORT: 6379
      REDIS_PASSWORD: ""
    volumes:
      - ./:/var/www/html
      - onesol_storage:/var/www/html/storage
      - onesol_uploads:/var/www/html/assets/uploads
    depends_on:
      db:
        condition: service_healthy
      cache:
        condition: service_healthy
    networks:
      - onesol_network

  # ----------------------------------------------------------------------------
  # MySQL 8.0 Database Container
  # ----------------------------------------------------------------------------
  db:
    image: mysql:8.0
    container_name: onesol_app_db
    restart: always
    command: --default-authentication-plugin=mysql_native_password --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASS:-root_secret}
      MYSQL_DATABASE: ${DB_NAME:-onesol_invoices}
      MYSQL_USER: ${DB_USER:-onesol}
      MYSQL_PASSWORD: ${DB_PASS:-onesol_secret}
    ports:
      - "127.0.0.1:${DB_EXTERNAL_PORT:-3307}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p${DB_ROOT_PASS:-root_secret} || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - onesol_network

  # ----------------------------------------------------------------------------
  # Redis 7 Alpine Caching & TTL Jitter Container
  # ----------------------------------------------------------------------------
  cache:
    image: redis:7-alpine
    container_name: onesol_app_cache
    restart: always
    command: redis-server --appendonly yes
    ports:
      - "127.0.0.1:${REDIS_EXTERNAL_PORT:-6380}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - onesol_network

# ------------------------------------------------------------------------------
# Persistent Docker Volumes & Isolated Network
# ------------------------------------------------------------------------------
volumes:
  mysql_data:
    driver: local
  redis_data:
    driver: local
  onesol_storage:
    driver: local
  onesol_uploads:
    driver: local

networks:
  onesol_network:
    driver: bridge
